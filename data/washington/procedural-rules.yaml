      "enabled": true
    },
    {
      "id": "WA-RECORDS-ACCESS-01",
      "authority_id": "WAC-891A",
      "citation": "WAC 388-891A-0140(1)-(2)",
      "url": "https://app.leg.wa.gov/wac/default.aspx?cite=388-891A-0140",
      "summary": "A participant may request access to or copies of the DVR case-service record. DVR provides access or copies within five business days after receiving the request, or sends written notice explaining the delay and the date access or copies will be provided.",
      "trigger_event": "case_service_record_request_received_by_dvr",
      "required_inputs": [
        "record_scope",
        "request_received_by_dvr",
        "requested_format"
      ],
      "exceptions": [
        "Potentially harmful information is released only through a participant-chosen third party as provided by the rule.",
        "Information received from another agency or service provider is subject to that originating entity's release conditions.",
        "If a court-appointed representative exists, the information must be released to that representative."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
      "version": "0.1.0",
      "jurisdiction": "US-WA",
