    {
      "id": "WA-WRITTEN-RESPONSE-01",
      "authority_id": "WAC-891A",
      "citation": "WAC 388-891A-0211(1)-(2)",
      "url": "https://app.leg.wa.gov/wac/default.aspx?cite=388-891A-0211",
      "summary": "If a DVR counselor makes a decision to deny a request for a VR service, reasonable accommodation, or another request affecting participation, the counselor responds orally and in writing within ten working days of receiving the request. The written response states reasons and appeal rights, or explains additional time and supplemental information needed.",
      "trigger_event": "counselor_decides_to_deny_covered_request",
      "required_inputs": [
        "covered_request",
        "request_received_date",
        "denial_decision"
      ],
      "exceptions": [
        "The rule is triggered by a counselor decision to deny a covered request; it is not a universal ten-working-day response requirement for every request made to DVR.",
        "Subsection (2)(b) expressly allows the written response to explain additional time and the supplemental information needed."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
      "version": "0.2.0",
      "jurisdiction": "US-WA",
      "review_status": "approved",
      "last_reviewed": "2026-09-27",
      "reviewer": "LimeTreeIsland",
      "approval_reference": "PR #11; maintainer approval recorded 2026-09-27; trigger encoding corrected by maintainer-directed V1B-04 audit; exact working-day calculation remains disabled under PR #24 approval",
      "enabled": true
    },
