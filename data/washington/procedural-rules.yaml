    {
      "id": "WA-PRA-RESPONSE-01",
      "authority_id": "RCW-4256",
      "citation": "RCW 42.56.520; WAC 388-01-090",
      "url": "https://app.leg.wa.gov/RCW/default.aspx?cite=42.56.520",
      "summary": "Within five business days of receiving a public-record request, the agency must take an allowed initial-response action. The five-business-day rule is not a guaranteed production deadline.",
      "trigger_event": "public_record_request_received",
      "required_inputs": [
        "request_received_event"
      ],
      "exceptions": [
        "DSHS may acknowledge the request and provide a reasonable estimate rather than producing all records within five business days.",
        "DSHS may seek clarification, provide records in installments, or deny the request in writing with reasons.",
        "Under WAC 388-01-090(3), a request received after office hours is considered received on the following business day; exact calendar calculation remains disabled."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
      "version": "0.1.0",
      "jurisdiction": "US-WA",
