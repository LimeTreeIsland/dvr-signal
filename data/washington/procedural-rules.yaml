    {
      "id": "WA-WRITTEN-RESPONSE-01",
      "authority_id": "WAC-891A",
      "citation": "WAC 388-891A-0211(1)-(2)",
      "url": "https://app.leg.wa.gov/wac/default.aspx?cite=388-891A-0211",
      "summary": "If a DVR counselor makes a decision to deny a request for a VR service, reasonable accommodation, or another request affecting participation, the counselor responds orally and in writing within ten working days of receiving the request. The written response states reasons and appeal rights, or explains additional time and supplemental information needed.",
      "trigger_event": "request_received_by_dvr",
      "required_inputs": [
        "covered_request",
        "request_received_date",
        "denial_decision",
        "supplemental_information_response"
      ],
      "exceptions": [
        "This is not treated as a universal final-decision deadline for every accommodation request; subsection (2)(b) expressly contemplates additional time for supplemental information."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
      "version": "0.1.0",
