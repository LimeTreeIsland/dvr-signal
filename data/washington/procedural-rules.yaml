    {
      "id": "ADA-COMMUNICATION-01",
      "authority_id": "ADA-TITLE-II",
      "citation": "28 CFR 35.160(a)-(b)",
      "url": "https://www.ecfr.gov/current/title-28/chapter-I/part-35/subpart-E/section-35.160",
      "summary": "A public entity must take appropriate steps to ensure effective communication and furnish appropriate auxiliary aids/services when necessary for equal participation, giving primary consideration to the individual's requested aid or service.",
      "trigger_event": "effective_communication_support_requested",
      "required_inputs": [
        "communication_barrier",
        "requested_aid_or_service",
        "communication_context"
      ],
      "exceptions": [
        "Primary consideration does not guarantee that every requested method must be provided; effectiveness and applicable legal limitations remain case-specific."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
