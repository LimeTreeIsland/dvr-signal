    {
      "id": "WA-PRA-REQUEST-01",
      "authority_id": "WAC-388-01",
      "citation": "WAC 388-01-060",
      "url": "https://app.leg.wa.gov/wac/default.aspx?cite=388-01-060",
      "summary": "A DSHS public-record request may be verbal or written and may be directed to the DSHS Public Records Officer. DSHS prefers form 17-041 but does not make that form mandatory.",
      "trigger_event": "public_record_request",
      "required_inputs": [
        "record_scope",
        "request_destination",
        "requested_format"
      ],
      "exceptions": [
        "Third-party requests for confidential client records require valid authorization as provided by WAC 388-01-150.",
        "DSHS may request identification where law makes a record disclosable only to a specific person."
      ],
      "timeframe": null,
