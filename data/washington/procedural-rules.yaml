      "citation": "WAC 388-891A-0255(2)",
      "url": "https://app.leg.wa.gov/wac/default.aspx?cite=388-891A-0255",
      "summary": "A fair-hearing request must be submitted within forty-five calendar days of the date the DVR counselor issues the decision with which the participant disagrees.",
      "trigger_event": "dvr_counselor_issues_decision",
      "required_inputs": [
        "decision_issue_date"
      ],
      "exceptions": [
        "Exact calculation requires the decision issue date; receipt date is not substituted.",
        "If the calculated 45th day falls on a Saturday, Sunday, or Washington legal holiday, the deadline moves to the next business day under WAC 388-02-0035.",
        "The filing deadline ends at 5:00 p.m. under WAC 388-02-0035."
      ],
      "timeframe": {
        "amount": 45,
        "unit": "calendar_days",
        "counting_rule_status": "approved"
