    {
      "id": "ADA-MODIFICATION-01",
      "authority_id": "ADA-TITLE-II",
      "citation": "28 CFR 35.130(b)(7)(i)",
      "url": "https://www.ecfr.gov/current/title-28/chapter-I/part-35/subpart-B/section-35.130",
      "summary": "A public entity must make reasonable modifications in policies, practices, or procedures when necessary to avoid disability discrimination, unless it demonstrates that the modification would fundamentally alter the nature of the service, program, or activity.",
      "trigger_event": "disability_related_modification_requested",
      "required_inputs": [
        "barrier",
        "requested_change",
        "program_or_activity"
      ],
      "exceptions": [
        "The tool does not determine whether a requested modification is reasonable, necessary, or a fundamental alteration in a particular case."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
