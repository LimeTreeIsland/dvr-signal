    {
      "id": "FED-VR-COMMUNICATION-01",
      "authority_id": "CFR-361",
      "citation": "34 CFR 361.51(c); 361.52",
      "url": "https://www.ecfr.gov/current/title-34/part-361/section-361.51",
      "summary": "VR service providers must be able to communicate using appropriate modes of communication used by applicants and eligible individuals; informed-choice information and support must likewise be provided through appropriate modes of communication.",
      "trigger_event": "vr_communication_support_needed",
      "required_inputs": [
        "communication_mode",
        "vr_participation_context"
      ],
      "exceptions": [
        "This rule supports communication access but does not by itself decide the specific auxiliary aid or accommodation required in an individual case."
      ],
