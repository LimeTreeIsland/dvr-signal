    {
      "id": "FED-RECORDS-01",
      "authority_id": "CFR-361",
      "citation": "34 CFR 361.38(c)(1)-(4)",
      "url": "https://www.ecfr.gov/current/title-34/section-361.38",
      "summary": "A written request for an individual's own record of services requires timely access/release, subject to harmful-information, originating-entity, and court-appointed-representative conditions; amendment requests are separately recognized.",
      "trigger_event": "written_request_for_own_record",
      "required_inputs": [
        "record_scope",
        "requester_authority",
        "requested_format"
      ],
      "exceptions": [
        "Medical, psychological, or other information DVR determines may be harmful is released through a participant-chosen third party, unless a court-appointed representative must receive it.",
        "Information obtained from another agency or organization may be released only by, or under conditions established by, that originating entity."
      ],
      "timeframe": null,
      "source_status": "live_text_checked",
      "source_checked_on": "2026-09-27",
      "version": "0.1.0",
      "jurisdiction": "US-WA",
